---
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: write

jobs:
  test:
    name: Build and Test
    uses: neticdk/shared-github-actions/.github/workflows/go-ci.yaml@7f40f2ee42ef4da483be96d6154bbb27d9ab0264 # v0.8.3
    with:
      run-benchmarks: true
      run-release-test: true

  goreleaser_snapshot:
    name: Run GoReleaser dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --snapshot --skip=publish --clean
